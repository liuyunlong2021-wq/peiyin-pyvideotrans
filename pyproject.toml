[project]
name = "pyVideoTrans"
version = "4.05"
requires-python = ">=3.10, <3.11"
dependencies = [
    "aiohttp>=3.12.0",
    "funasr==1.3.1",
    "huggingface-hub>=1.10.0",
    "librosa==0.11.0",
    "modelscope==1.34.0",
    "numpy==1.26.0",
    "onnxruntime",
    "openai>=2.0.0",
    "psutil>=6.0.0",
    "pydub==0.25.1",
    "pyrubberband>=0.4.0",
    "pyside6==6.9.2",
    "qdarkstyle==3.2.3",
    "qwen-tts-pvt==0.1.1",
    "requests[socks]>=2.32.0",
    "soundfile==0.13.1",
    "tenacity>=9.0.0",
    "torch==2.7.1",
    "torchaudio==2.7.1",
]

[dependency-groups]
dev = [
    "pytest",
]
lint = [
    "ruff",
]

[tool.uv]
override-dependencies = [
    "gradio ; sys_platform == 'never'",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchcodec ; sys_platform == 'never'",
]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
