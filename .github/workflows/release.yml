name: Build lightweight desktop downloads

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build launcher
        shell: cmd
        run: cl /nologo /O2 /DUNICODE /D_UNICODE scripts\windows-launcher.c /Fe:赚钱音浪.exe user32.lib shell32.lib
      - name: Build ZIP
        shell: pwsh
        run: |
          git archive --format=zip --output=$env:RUNNER_TEMP\source.zip HEAD
          Expand-Archive $env:RUNNER_TEMP\source.zip $env:RUNNER_TEMP\赚钱音浪-Windows
          Copy-Item 赚钱音浪.exe $env:RUNNER_TEMP\赚钱音浪-Windows\赚钱音浪.exe
          if (-not (Test-Path $env:RUNNER_TEMP\赚钱音浪-Windows\pyproject.toml) -or -not (Test-Path $env:RUNNER_TEMP\赚钱音浪-Windows\赚钱音浪.exe)) { throw 'Windows package is incomplete' }
          if ((Test-Path $env:RUNNER_TEMP\赚钱音浪-Windows\.venv) -or (Test-Path $env:RUNNER_TEMP\赚钱音浪-Windows\models)) { throw 'Windows package contains local runtime data' }
          Compress-Archive $env:RUNNER_TEMP\赚钱音浪-Windows $env:RUNNER_TEMP\ZhuanqianYinlang-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ZhuanqianYinlang-Windows
          path: ${{ runner.temp }}/ZhuanqianYinlang-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal launcher
        run: clang -O2 -arch arm64 -arch x86_64 赚钱音浪.app/Contents/MacOS/launch.c -o 赚钱音浪.app/Contents/MacOS/launch
      - name: Build ZIP
        run: |
          ROOT="$RUNNER_TEMP/赚钱音浪-macOS"
          mkdir -p "$ROOT"
          git archive HEAD | tar -x -C "$ROOT"
          cp 赚钱音浪.app/Contents/MacOS/launch "$ROOT/赚钱音浪.app/Contents/MacOS/launch"
          chmod +x "$ROOT/赚钱音浪.app/Contents/MacOS/launch" "$ROOT/scripts/bootstrap-macos.sh"
          test -f "$ROOT/pyproject.toml"
          test -x "$ROOT/赚钱音浪.app/Contents/MacOS/launch"
          test ! -e "$ROOT/.venv"
          test ! -e "$ROOT/models"
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$RUNNER_TEMP/ZhuanqianYinlang-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ZhuanqianYinlang-macOS
          path: ${{ runner.temp }}/ZhuanqianYinlang-macOS.zip

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build Intel launcher
        run: |
          clang -O2 -arch x86_64 赚钱音浪.app/Contents/MacOS/launch.c -o 赚钱音浪.app/Contents/MacOS/launch
          file 赚钱音浪.app/Contents/MacOS/launch | grep -q 'x86_64'
      - name: Verify Intel runtime
        run: |
          brew install ffmpeg libsndfile
          uv sync --locked
          uv run python -c "import PySide6, torch, onnxruntime; print('Intel runtime: ok')"
      - name: Build Intel ZIP
        run: |
          ROOT="$RUNNER_TEMP/赚钱音浪-macOS-Intel"
          mkdir -p "$ROOT"
          git archive HEAD | tar -x -C "$ROOT"
          cp 赚钱音浪.app/Contents/MacOS/launch "$ROOT/赚钱音浪.app/Contents/MacOS/launch"
          chmod +x "$ROOT/赚钱音浪.app/Contents/MacOS/launch" "$ROOT/scripts/bootstrap-macos.sh"
          test -f "$ROOT/pyproject.toml"
          test -x "$ROOT/赚钱音浪.app/Contents/MacOS/launch"
          test ! -e "$ROOT/.venv"
          test ! -e "$ROOT/models"
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$RUNNER_TEMP/ZhuanqianYinlang-macOS-Intel.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ZhuanqianYinlang-macOS-Intel
          path: ${{ runner.temp }}/ZhuanqianYinlang-macOS-Intel.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "赚钱音浪 $GITHUB_REF_NAME" --notes "下载对应系统的 ZIP，解压后双击赚钱音浪。首次启动自动安装运行环境；模型在软件内按需下载。"
          gh release upload "$GITHUB_REF_NAME" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
